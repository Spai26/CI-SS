services:
  # Instancia dedicada para PGMQ
  postgres-pgmq:
    image: ghcr.io/pgmq/pg18-pgmq:v1.10.0
    container_name: pgmq-ciudar-db
    restart: always
    environment:
      POSTGRES_DB: DBCUIDAR
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpw_2025
    ports:
      - "5440:5432" # para que no choque con tu otro Postgres
    volumes:
      - pgmq_data_vol:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d DBCUIDAR"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pgmq-net

  # PGAdmin dedicado para este bloque
  pgadmin-pgmq:
    image: dpage/pgadmin4:7.8
    container_name: pgmq-cuidar-admin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8083:80" # para no chocar con el PGAdmin o Redis
    depends_on:
      postgres-pgmq:
        condition: service_healthy
    networks:
      - pgmq-net

  # Backend (Spring Boot)
  backend:
    image: maven:3.9.6-eclipse-temurin-21
    container_name: cuidar-backend
    working_dir: /app
    volumes:
      - ./api:/app
      - maven_repo:/root/.m2
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-pgmq:5432/DBCUIDAR
      - DB_USERNAME=postgres
      - DB_PASSWORD=devpw_2025
      - MAVEN_OPTS=-Djooq.codegen.skip=true
    command: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev -Dmaven.test.skip=true -Djooq.codegen.skip=true
    depends_on:
      postgres-pgmq:
        condition: service_healthy
    networks:
      - pgmq-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Frontend (Vite + React)
  frontend:
    image: node:22-alpine
    container_name: cuidar-frontend
    working_dir: /app
    environment:
      - PORT=5173
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    networks:
      - pgmq-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgmq_data_vol: # Volumen único para este proyecto
    driver: local
  maven_repo:
    driver: local
networks:
  pgmq-net:
    driver: bridge