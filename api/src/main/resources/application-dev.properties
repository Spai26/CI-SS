# ============================================================
# DEV profile - local docker-compose Postgres (PGMQ image)
# ============================================================

# Database
spring.datasource.url=jdbc:postgresql://localhost:5440/DBCUIDAR
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:devpw_2025}

# Flyway: schema-first migrations (run before app beans)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# jOOQ
spring.jooq.sql-dialect=POSTGRES
spring.jooq.show-sql=true

# DevTools (already in pom with scope=runtime)
spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true

# Detailed actuator on dev
management.endpoint.health.show-details=always

# JWT placeholder - NOT a real secret, just to satisfy SecurityConfig wiring in dev.
# Real production tokens must be signed by an external IdP (Keycloak/Auth0/etc).
app.security.jwt.issuer-uri=${JWT_ISSUER_URI:http://localhost:9000}