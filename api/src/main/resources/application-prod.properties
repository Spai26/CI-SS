# ============================================================
# PROD profile - environment-driven configuration
# ============================================================

# Database - all values MUST be provided via environment variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway: schema-first migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# jOOQ
spring.jooq.sql-dialect=POSTGRES
spring.jooq.show-sql=false

# JWT - must come from real IdP issuer
app.security.jwt.issuer-uri=${JWT_ISSUER_URI}