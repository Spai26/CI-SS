# ============================================================
# TEST profile - used by AbstractIntegrationTest with Testcontainers
# ============================================================

# The actual DataSource is overridden at runtime by TestcontainersConfig
# (DynamicPropertySource registers the container JDBC URL/credentials).
# These values are placeholders so Spring can boot if a test forgets to start a container.
spring.datasource.url=jdbc:postgresql://localhost:0/test
spring.datasource.username=test
spring.datasource.password=test

# Disable security autoconfiguration wiring that requires a real JWT issuer in tests
app.security.jwt.issuer-uri=http://localhost:0

# jOOQ
spring.jooq.sql-dialect=POSTGRES
spring.jooq.show-sql=false