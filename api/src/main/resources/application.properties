spring.application.name=cuidar-api
spring.application.description=Plataforma que conecta familias con cuidadores verificados para el adulto mayor
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:8080}

# API versioning is enforced via ApiPaths (see common/web/ApiPaths.java)
# All controllers expose their routes under /api/v1/...

# Actuator: only health + info are exposed by default; details hidden in non-dev profiles
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# jOOQ (Spring Boot autoconfigures DSLContext from the DataSource)
spring.jooq.sql-dialect=POSTGRES